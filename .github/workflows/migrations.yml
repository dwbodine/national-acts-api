name: Database migrations
on:
  push:
  pull_request:
jobs:
  mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.2.2-noble
        env:
          MARIADB_ROOT_PASSWORD: migration-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libmariadb-dev gcc
      - run: python -m pip install -r requirements-dev.txt
      - name: Migration integration checks
        env:
          TEST_MARIADB_PORT: '3306'
          TEST_MARIADB_PASSWORD: migration-ci-only
        run: python -m pytest -o addopts='' test/integration test/test_release_scripts.py
      - name: Shell syntax
        run: |
          for script in deploy.sh entrypoint.sh aws/release-common.sh aws/release-api.sh aws/rollback-api.sh aws/build-api.sh aws/build-db.sh aws/rebuild-all.sh; do
            bash -n "$script" || exit 1
          done

services:
  nationalactsdb:
    image: nationalactsdb
    container_name: nationalactsdb
    restart: always
    build:
      context: .
      dockerfile: ./MySql.Dockerfile
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    depends_on:
      - nationalactsdb
    environment:
      PMA_HOST: nationalactsdb
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      MYSQL_ROOT_PASSWORD: All41n14@ll
    ports:
      - 8080:80
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    
volumes:
  db_data:
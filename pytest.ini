[pytest]
minversion = 9.0
testpaths =
    test
python_files =
    test_*.py
python_classes =
    Test*
python_functions =
    test_*
addopts =
    -ra
    -p no:cacheprovider
    --basetemp=.\test_runtime\pytest
    --strict-config
    --strict-markers
    --cov=api
    --cov=common
    --cov=app
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
markers =
    unit: Fast tests with database, network, and external services mocked.
    integration: Tests that require a database, network, or other external service.
